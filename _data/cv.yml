    Publications:
      - title: MILP-SAT-GNN: Yet Another Neural SAT solver
        authors:
          - Franco Alberto Cardillo
          - Hamza Khyari
          - Riccardo Paoli
          - Umberto Straccia
        publisher: Annalen der Physik
        releaseDate: 2026
        url: 
        summary: We propose a novel method that enables Graph Neural Networks (GNNs) to solve SAT problems by leveraging a technique developed for applying GNNs to Mixed Integer Linear Programming (MILP). Specifically, k-CNF formulae are mapped into MILP problems, which are then encoded as weighted bipartite graphs and subsequently fed into a GNN for training and testing. We illustrate some theoretical results and conduct an experimental evaluation showing that, despite the simplicity of the neural architecture, the method achieves promising results.
